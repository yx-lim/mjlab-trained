name: model-storage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-model-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.27"
      - name: Check curated models and reject generated training output
        run: uv run --no-project scripts/check_model_storage.py

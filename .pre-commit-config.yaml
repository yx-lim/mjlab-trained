repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.14
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    - id: model-storage
      name: Check curated model storage
      entry: uv run --no-project scripts/check_model_storage.py
      language: system
      pass_filenames: false
      always_run: true
